[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slidethus"
version = "0.4.0"
description = "Agentic presentation engineering skill foundation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Slidethus contributors"}]
dependencies = [
  "jsonschema>=4.22,<5",
  "python-pptx>=1,<2",
]

[project.optional-dependencies]
ingestion = [
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
]

[project.scripts]
slidethus = "slidethus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slidethus = ["_schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["source_material"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
