[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slidethus"
version = "0.9.1"
description = "Agentic presentation engineering skill foundation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Slidethus contributors"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "jsonschema>=4.22,<5",
  "python-pptx>=1,<2",
]

[project.optional-dependencies]
ingestion = [
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
]

[project.scripts]
slidethus = "slidethus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slidethus = ["_schemas/*.json"]

[tool.setuptools.data-files]
"share/slidethus/skills/slidethus" = [".agents/skills/slidethus/SKILL.md"]
"share/slidethus/skills/slidethus/agents" = [".agents/skills/slidethus/agents/openai.yaml"]
