name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderers/pptxgenjs/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: npm ci --prefix renderers/pptxgenjs
      - run: python -m compileall -q src tests scripts
      - run: ruff check src tests scripts
      - run: python -m pytest
      - run: python scripts/validate_all.py
      - run: python scripts/audit_package.py --ci
